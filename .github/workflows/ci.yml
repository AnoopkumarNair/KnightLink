name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Build and test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The hosted Ubuntu image ships the Android SDK and exports ANDROID_HOME, so no SDK setup step is needed.
      - run: ./gradlew check :app:android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: knightlink-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"

  ios:
    name: Shared code on iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Runs the common tests on the iOS simulator so portability breaks are caught without a local Mac.
      - run: ./gradlew iosSimulatorArm64Test --console=plain
